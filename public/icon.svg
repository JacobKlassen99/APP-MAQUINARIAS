<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e325d"/>
      <stop offset="100%" stop-color="#07172b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Base background (for standalone & maskable) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Machinery Cog / Industrial Gear rim in background -->
  <g fill="none" stroke="#1e3a63" stroke-width="12" stroke-dasharray="24 16">
    <circle cx="256" cy="256" r="190"/>
  </g>

  <!-- Bulldozer / Heavy Machinery Silhouette in center -->
  <g transform="translate(76, 110)">
    <!-- Cabin -->
    <path d="M 120 70 L 220 70 L 250 140 L 120 140 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 135 85 L 185 85 L 185 130 L 135 130 Z" fill="#0a2342"/>
    <path d="M 195 85 L 230 85 L 245 130 L 195 130 Z" fill="#0a2342"/>

    <!-- Engine Hood & Body -->
    <rect x="250" y="100" width="70" height="40" rx="6" fill="#f59e0b"/>
    <rect x="90" y="140" width="240" height="35" rx="8" fill="url(#goldGrad)"/>

    <!-- Exhaust Pipe -->
    <rect x="270" y="55" width="12" height="45" rx="3" fill="#cbd5e1"/>
    <path d="M 282 55 Q 295 50 300 40" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Bulldozer Push Arm & Blade -->
    <path d="M 240 160 L 330 190" stroke="#d97706" stroke-width="16" stroke-linecap="round"/>
    <path d="M 330 120 C 355 160, 355 210, 330 240 L 315 235 C 335 205, 335 155, 315 125 Z" fill="#f59e0b"/>

    <!-- Heavy Caterpillar Track System -->
    <!-- Outer Track Oval -->
    <rect x="70" y="170" width="230" height="75" rx="37.5" fill="#1e293b" stroke="#f8fafc" stroke-width="6"/>
    <!-- Track Inner Cutout -->
    <rect x="105" y="190" width="160" height="35" rx="17.5" fill="#0f172a"/>
    <!-- Wheels Inside Track -->
    <circle cx="125" cy="207.5" r="16" fill="#cbd5e1"/>
    <circle cx="125" cy="207.5" r="7" fill="#0f172a"/>
    <circle cx="165" cy="207.5" r="14" fill="#64748b"/>
    <circle cx="165" cy="207.5" r="6" fill="#0f172a"/>
    <circle cx="205" cy="207.5" r="14" fill="#64748b"/>
    <circle cx="205" cy="207.5" r="6" fill="#0f172a"/>
    <circle cx="245" cy="207.5" r="16" fill="#cbd5e1"/>
    <circle cx="245" cy="207.5" r="7" fill="#0f172a"/>

    <!-- Track Treads Lines -->
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6">
      <line x1="85" y1="172" x2="85" y2="182"/>
      <line x1="120" y1="170" x2="120" y2="180"/>
      <line x1="155" y1="170" x2="155" y2="180"/>
      <line x1="190" y1="170" x2="190" y2="180"/>
      <line x1="225" y1="170" x2="225" y2="180"/>
      <line x1="260" y1="170" x2="260" y2="180"/>
      <line x1="285" y1="172" x2="285" y2="182"/>
      <line x1="85" y1="235" x2="85" y2="245"/>
      <line x1="120" y1="240" x2="120" y2="250"/>
      <line x1="155" y1="240" x2="155" y2="250"/>
      <line x1="190" y1="240" x2="190" y2="250"/>
      <line x1="225" y1="240" x2="225" y2="250"/>
      <line x1="260" y1="240" x2="260" y2="250"/>
      <line x1="285" y1="235" x2="285" y2="245"/>
    </g>
  </g>

  <!-- Accent Emblem / Text Badge at bottom -->
  <g transform="translate(256, 440)">
    <rect x="-140" y="-22" width="280" height="34" rx="17" fill="url(#goldGrad)"/>
    <text x="0" y="2" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#0a2342" letter-spacing="3">CONTROL</text>
  </g>
</svg>
